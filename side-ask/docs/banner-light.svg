<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">side-ask</title>
  <desc id="d">A terminal with a selected phrase in Claude's reply and a side pane answering a question about it, off the record.</desc>
  <style>
    .bg { fill: #faf9f5; }
    .win { fill: #ffffff; stroke: #e3e0d6; }
    .bar { fill: #f0eee6; }
    .ink { fill: #1f1e1d; }
    .muted { fill: #6b685f; }
    .faint { fill: #e3e0d6; }
    .pane { fill: #fdfcf9; stroke: #d97757; }
    .rule { stroke: #e3e0d6; }
    .caret { fill: #1f1e1d; }
    .chip { fill: #ffffff; }
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d97757" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect class="bg" width="1280" height="320"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <ellipse cx="1090" cy="170" rx="300" ry="190" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="64" y="132" class="ink" font-size="68" font-weight="700" letter-spacing="-2">side<tspan fill="#d97757">-</tspan>ask</text>
  <text x="66" y="178" class="muted" font-size="19">Ask on the side. Keep your context clean.</text>
  <g font-size="17" font-weight="700" transform="translate(66 230)">
    <text x="0" fill="#4eba65">;</text><text x="16" class="muted" font-weight="400">ask</text>
    <text x="72" fill="#7aa2f7">;e</text><text x="98" class="muted" font-weight="400">example</text>
    <text x="196" fill="#e5b454">;w</text><text x="222" class="muted" font-weight="400">why</text>
    <text x="276" fill="#e06c75">;p</text><text x="302" class="muted" font-weight="400">pitfalls</text>
    <text x="410" fill="#b18cf2">;v</text><text x="436" class="muted" font-weight="400">vs</text>
  </g>
  <rect x="66" y="256" width="44" height="4" rx="2" fill="#d97757"/>

  <!-- Terminal window -->
  <g transform="translate(600 36)">
    <rect class="win" width="632" height="248" rx="14" stroke-width="1.5"/>
    <path class="bar" d="M14 0h604a14 14 0 0 1 14 14v18H0V14A14 14 0 0 1 14 0z"/>
    <circle cx="20" cy="16" r="5.5" fill="#e06c75"/>
    <circle cx="38" cy="16" r="5.5" fill="#e5b454"/>
    <circle cx="56" cy="16" r="5.5" fill="#4eba65"/>
    <text x="316" y="21" class="muted" font-size="12" text-anchor="middle">claude</text>

    <!-- Chat column -->
    <g font-size="13">
      <circle cx="24" cy="58" r="4" fill="#d97757"/>
      <rect class="faint" x="36" y="53" width="250" height="9" rx="4.5"/>
      <rect class="faint" x="36" y="73" width="292" height="9" rx="4.5"/>
      <rect x="34" y="88" width="152" height="20" rx="4" fill="#d97757" fill-opacity="0.30"/>
      <text x="40" y="103" class="ink">cleanup runs first</text>
      <rect class="faint" x="194" y="93" width="132" height="9" rx="4.5"/>
      <rect class="faint" x="36" y="117" width="224" height="9" rx="4.5"/>
      <rect class="faint" x="36" y="137" width="268" height="9" rx="4.5"/>
      <rect class="faint" x="36" y="157" width="150" height="9" rx="4.5"/>
      <line class="rule" x1="16" y1="196" x2="340" y2="196"/>
      <text x="20" y="222" fill="#d97757" font-weight="700">❯</text>
      <text x="38" y="222" fill="#e5b454" font-weight="700">;w</text>
      <rect class="caret" x="62" y="210" width="8" height="16" fill-opacity="0.85"/>
    </g>

    <!-- Side pane -->
    <g transform="translate(356 46)">
      <rect class="pane" width="260" height="188" rx="10" stroke-width="1.5"/>
      <rect x="14" y="14" width="52" height="20" rx="4" fill="#d97757"/>
      <text x="40" y="29" class="chip" font-size="12" font-weight="700" text-anchor="middle">SIDE</text>
      <text x="76" y="29" class="muted" font-size="12">off the record</text>
      <text x="14" y="62" font-size="13" fill="#7aa2f7">❯ why is it done this way?</text>
      <circle cx="19" cy="84" r="4" fill="#e5b454"/>
      <rect class="muted" x="30" y="79" width="200" height="9" rx="4.5" fill-opacity="0.55"/>
      <rect class="muted" x="30" y="97" width="214" height="9" rx="4.5" fill-opacity="0.55"/>
      <rect class="muted" x="30" y="115" width="168" height="9" rx="4.5" fill-opacity="0.55"/>
      <rect class="muted" x="30" y="133" width="120" height="9" rx="4.5" fill-opacity="0.55"/>
      <text x="14" y="172" class="muted" font-size="11">⎿ 18.2k cached · 96 out</text>
    </g>
  </g>
</svg>
